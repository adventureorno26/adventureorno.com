# basemap — copies the Protomaps planet into R2, then serves tiles out of it.
#
# Deploy: cd workers/basemap && npx wrangler deploy
#
# The copy never touches Erica's machine: the source is served from Cloudflare
# and R2 is Cloudflare, so the bytes stay on their network. See docs/STATE.md
# Phase 4 for why we own this at all.
name = "adventureorno-basemap"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# ON OUR OWN DOMAIN, not workers.dev.
#
# Three reasons, all of which have bitten this project already:
#  1. The service worker cannot usefully cache a cross-origin response, and tiles
#     and photos are the two heaviest things the app fetches.
#  2. Every external host is a CSP entry, and a CSP entry is something that can be
#     silently BLOCKED — which is exactly how the Mapbox search died unnoticed.
#  3. No CORS preflight, and no third-party-looking hostname in front of private data.
#
# A Worker route takes precedence over Pages for matching paths, so /basemap/* comes
# here and everything else still goes to the app.
#
# THIS MUST STAY ABOVE [r2_buckets] AND [vars]. In TOML a bare key after a table header
# belongs to that table: when this block sat at the end of the file, wrangler read it as
# a VARIABLE named `routes` and published no route at all. The zone had zero routes, and
# every /basemap/ URL fell through to Pages, which answered 200 with the app's HTML —
# a failure that looks exactly like success.
routes = [
  { pattern = "adventureorno.com/basemap/*", zone_name = "adventureorno.com" }
]

[[r2_buckets]]
binding = "BASEMAP"
bucket_name = "aon-basemap"

[vars]
# The daily planet build being copied. 137.3 GB, zoom 0-15, PMTiles spec 3.
SOURCE_URL = "https://build.protomaps.com/20260810.pmtiles"
# The object it lands on inside the bucket.
OBJECT_KEY = "planet.pmtiles"
