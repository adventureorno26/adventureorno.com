# watchtower — probes every service we run and records what came back.
#
# Deploy: cd workers/watchtower && npx wrangler deploy
#
# NOT routed on adventureorno.com. It has no business being reachable from the web; the
# cron is what runs it, and /watchtower/run exists for a person on workers.dev.
#
# Secrets (npx wrangler secret put NAME):
#   SUPABASE_SERVICE_ROLE_KEY   writes the ledger; RLS forbids anon and authenticated
#   GITHUB_TOKEN                READ-ONLY, `contents:read` on this repo only. Lets the
#                               deploy probe ask what `main` is, so "merged but not
#                               shipped" is visible. The repo is private, so an
#                               unauthenticated call gets a 404.
#
#                               WITHOUT IT the deploy probe reports a FAILURE, not a pass.
#                               Being unable to check is the same blindness that let
#                               production sit 16 commits behind for a day on 2026-08-15,
#                               so it is not something to skip quietly.
#
#                               This check lives HERE and not in CI on purpose: CI was the
#                               thing that was down. A freeze detector inside the frozen
#                               system detects nothing. Cloudflare's cron does not care
#                               about GitHub's billing.
name = "adventureorno-watchtower"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Every 15 minutes. service_status() calls a service stale after 30, so one missed run is
# tolerated and two are not.
[triggers]
crons = ["*/15 * * * *"]

[vars]
SITE = "https://adventureorno.com"
SUPABASE_URL = "https://aanfyhsjbtnqzphuoiem.supabase.co"
