# Supabase CLI config. Link with:  supabase link --project-ref aanfyhsjbtnqzphuoiem
project_id = "aanfyhsjbtnqzphuoiem"

[db]
# Postgres 17, matching production (17.6). This was 15 until 2026-08-11.
#
# The gap was real and known: local and CI ran 15 while production ran 17, so
# `supabase start` printed a version-mismatch warning and every SQL test proved
# something about a different engine than the one serving the app.
#
# It was left at 15 because an attempt on 2026-08-07 stalled: `supabase start` pulls
# a ~3.5 GB Postgres 17 image, and CI's database job runs inside a timeout, so an
# unverified bump risked breaking a required check. This change was made only after
# pulling the image and running the FULL migration chain and every SQL test against
# a fresh 17 container locally.
#
# If CI's database job ever times out on the image pull, cache the image rather than
# going back to 15 — a test suite that runs on the wrong major version is not
# evidence about production.
#
# Related: `supabase link` writes the linked project's service versions into
# supabase/.temp/*-version, which makes `supabase start` pull those images too —
# delete those files if a local start suddenly begins pulling.
major_version = 17

# Edge-function JWT behavior is declared here for EVERY function and checked
# against the live deployment by scripts/check-edge-config.mjs (CI job
# `edge-config-drift`), so an accidental verify_jwt change is caught. `true` =
# the platform requires a valid Supabase JWT (app-invoked, per-user). `false` =
# the endpoint is a public callback/webhook/device path that authenticates
# itself in the function body (OAuth code, Strava signature, device token, or a
# shared cron secret). Keep this list complete: an undeclared deployed function
# fails the drift check.

# --- App-invoked (require a user JWT) ---
[functions.invite]
verify_jwt = true

[functions.strava-backfill]
verify_jwt = true

[functions.import-timeline]
verify_jwt = true

[functions.ai-suggest]
verify_jwt = true

[functions.google-photos-token]
verify_jwt = true

# The suggester. Owner/editor from the Inbox, or a service_role token for the
# nightly sweep. It writes only to `suggestions` — it can change nothing.
[functions.suggest]
verify_jwt = true

# --- Public callbacks / webhooks / device + cron paths (self-authenticating) ---
# These authenticate in the function body: OAuth code exchange, the Strava push
# signature, the device ingest token, or a shared cron secret (modern Supabase
# sb_secret_ keys are valid only in the apikey header, not as JWTs).
[functions.strava-auth]
verify_jwt = false

[functions.strava-webhook]
verify_jwt = false

# RETIRED 2026-08-12 — the deployment was DELETED at Erica's instruction ("disable
# the nightly auto-detect feature"). Left commented rather than removed so a bulk
# `supabase functions deploy` cannot quietly bring it back, and so the reason is
# here if anyone wonders where it went. The source is still in
# supabase/functions/detect-trips/ and one deploy restores it.
# [functions.detect-trips]
# verify_jwt = false

[functions.geocode-new-places]
verify_jwt = false

[functions.ingest-overland]
verify_jwt = false
