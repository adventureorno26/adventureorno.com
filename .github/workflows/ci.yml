name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs only need to read the repo. Any job that needs more must
# opt in explicitly at the job level.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push series doesn't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: App — typecheck
        working-directory: app
        run: npx tsc -b
      - name: App — lint
        working-directory: app
        run: npm run lint
      - name: App — test
        working-directory: app
        run: npm run test
      - name: App — production build
        working-directory: app
        # The compile-time VITE_* values must exist during THIS build (Vite inlines
        # import.meta.env at build time), not only in the later e2e preview step —
        # otherwise the CI bundle inlines `undefined` for the Supabase URL/key and is
        # structurally invalid. Real client-safe values from secrets when present;
        # harmless placeholders otherwise so forks without secrets still build.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY || 'placeholder' }}
          VITE_PHOTO_GATEWAY_URL: ${{ secrets.VITE_PHOTO_GATEWAY_URL || 'https://placeholder.workers.dev' }}
          VITE_STRAVA_CLIENT_ID: ${{ secrets.VITE_STRAVA_CLIENT_ID || '0' }}
        run: npm run build

      - name: Worker — typecheck
        working-directory: workers/photo-gateway
        run: npm run typecheck
      - name: Worker — test
        working-directory: workers/photo-gateway
        run: npm run test
      # Real build check of the worker (no deploy). A dry-run only bundles, so it
      # must succeed — no more hiding failures behind `|| echo`.
      - name: Worker — wrangler dry-run
        working-directory: workers/photo-gateway
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Dependency/security scan. Surfaces advisories; not a hard gate yet because
      # transitive deps can carry unfixable highs — tighten to `--audit-level=high`
      # blocking once the tree is clean.
      - name: npm audit (report)
        run: npm audit --audit-level=high || true

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Current-tree secret scan (NOT git history — the history scrub is a separate,
      # owner-gated phase). Fails the build if any secret is committed to the working
      # tree. Pinned gitleaks binary; --redact so a match never prints the secret.
      - name: Gitleaks (current tree)
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --redact --exit-code 1 --verbose

  # --- Additional zero-cost security scanners (Prompt 8, recs 52–62) -----------
  # Each installs a PINNED tool and runs it, so a missing tool can't produce a false
  # green. Report-mode (|| true) for the ones that can surface unfixable transitive
  # findings — matches the existing `npm audit (report)` convention; tighten to a hard
  # gate once the tree is clean. Zizmor gates hard because we own every workflow.
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: OSV-Scanner (dependency vulnerabilities, report)
        run: |
          VER=2.4.0
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${VER}/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner scan source --recursive . || true

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Semgrep (SAST over first-party source, report)
        run: |
          pip install semgrep==1.172.0
          semgrep scan --config=auto --error --quiet app/src workers/photo-gateway src || true

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Zizmor (GitHub Actions workflow security — hard gate; we own these)
        run: |
          pip install zizmor==1.28.0
          zizmor .github/workflows/

  db-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Regenerate app/src/lib/database.types.ts from the live schema and fail if
      # it differs from what's committed — i.e. a migration changed the schema but
      # the checked-in types weren't refreshed (`npm run gen:types`). Only runs
      # when the token secret is configured; otherwise it's a no-op so forks/PRs
      # without the secret don't fail spuriously.
      - name: Check DB types are in sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping DB types drift check."
            exit 0
          fi
          npm run gen:types
          if ! git diff --exit-code -- app/src/lib/database.types.ts; then
            echo "::error::database.types.ts is stale. Run 'npm run gen:types' and commit the result."
            exit 1
          fi

  edge-config-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # Compare each deployed Edge Function's verify_jwt to the declaration in
      # supabase/config.toml. Catches an accidental auth-behavior change or a
      # redeploy that flips a public callback to JWT-required (or vice-versa).
      # Secret-guarded so forks/PRs without the token are a no-op.
      - name: Check Edge Function config is in sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-edge-config.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: App — build (preview target for e2e)
        working-directory: app
        run: npm run build
      - name: Install Playwright browsers
        working-directory: app
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright e2e (public + authed-if-secrets)
        working-directory: app
        # The authed specs SKIP when TEST_BOT_* aren't set, so this passes on
        # forks/PRs without secrets and runs the full suite when they're present.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TEST_BOT_EMAIL: ${{ secrets.TEST_BOT_EMAIL }}
          TEST_BOT_PASSWORD: ${{ secrets.TEST_BOT_PASSWORD }}
        run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest
      # The migration chain does NOT fresh-apply the way the CLI does it (0001
      # references public.profiles before it exists — see docs/decisions.md), so a
      # normal `supabase start`, which auto-applies migrations, would fail. Instead we
      # move the migrations aside so the CLI brings up a clean Postgres (+ auth / vault
      # / roles via gotrue) with NOTHING applied, restore them, then let
      # scripts/db-bootstrap.sh (invoked by db-test.sh) apply the real chain with
      # check_function_bodies=off + the single tolerated 0044 error and
      # production-faithful grants. db-test.sh then runs every supabase/tests/*.test.sql
      # under ON_ERROR_STOP=1 — any FAIL assertion, broken grant, RLS leak, or
      # migration error fails the job. No secrets (fully local + network-isolated).
      - name: Start local Supabase (empty migrations; bootstrap applies the real chain)
        run: |
          mkdir -p /tmp/aon-mig-hold
          mv supabase/migrations/*.sql /tmp/aon-mig-hold/
          supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          mv /tmp/aon-mig-hold/*.sql supabase/migrations/
      - name: Run SQL tests (migrations + RLS/trigger/RPC assertions)
        run: bash scripts/db-test.sh
      - name: Export/restore round-trip (byte-identity proof)
        run: bash scripts/export-restore-roundtrip.sh
      - name: Stop local Supabase
        if: ${{ !cancelled() }}
        run: supabase stop --no-backup || true

  # ---------------------------------------------------------------------------
  # TODO (scaffolding — need infra/secrets before enabling as required checks):
  #   * MUTATING acceptance flows (create place, log two visits, duplicate handling,
  #     upload retry) — need a dedicated TEST TENANT so they don't write to the
  #     household DB. Blocked on the commercial multi-tenant work (Space isolation).
  #   * preview-deploy smoke test: curl the Pages preview URL for 200 + key routes.
  #   * real-device iPhone/Android install-flow checks (acceptance #10) — manual.
  # Make `build`/`e2e` required checks in branch protection so CI gates merges.
