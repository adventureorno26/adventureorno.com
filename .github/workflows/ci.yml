name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # WEEKLY, not nightly. This run includes the full cross-browser matrix (~9 minutes of
    # billable time on its own) and it was firing every night — roughly 450 minutes a month
    # against a 3,000-minute allowance, to re-prove a suite that already runs on every PR
    # that touches app code. Sunday 09:00 UTC.
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the full cross-browser test matrix
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  SUPABASE_VERSION: "2.98.0"
  VITE_SUPABASE_URL: https://placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
  VITE_MAPTILER_KEY: placeholder
  VITE_PHOTO_GATEWAY_URL: https://placeholder.workers.dev
  VITE_STRAVA_CLIENT_ID: "0"

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.paths.outputs.build }}
      database: ${{ steps.paths.outputs.database }}
      security_code: ${{ steps.paths.outputs.security_code }}
      security_deps: ${{ steps.paths.outputs.security_deps }}
      security_workflows: ${{ steps.paths.outputs.security_workflows }}
      smoke: ${{ steps.paths.outputs.smoke }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine affected gates
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          set_all() {
            for gate in build database security_code security_deps security_workflows smoke; do
              echo "$gate=true" >> "$GITHUB_OUTPUT"
            done
          }

          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            set_all
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi

          files="$(git diff --name-only "$base" "$HEAD_SHA")"
          printf '%s\n' "$files"

          matches() {
            printf '%s\n' "$files" | grep -Eq "$1"
          }

          output() {
            if matches "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }

          output build '^(app/(src|public)/|app/(vite\.config|package|tsconfig)|workers/|scripts/(check-bundle|check-env)|package(-lock)?\.json$|\.env\.example$|\.github/workflows/)'
          output database '^(supabase/|app/src/lib/database\.types\.ts$|scripts/(gen-types|check-edge|db-|export-|restore-)|package(-lock)?\.json$|\.github/workflows/)'
          output security_code '^(app/src/|workers/|supabase/functions/|scripts/check-semgrep|security/semgrep)'
          output security_deps '^(package(-lock)?\.json$|app/package(-lock)?\.json$|scripts/(check-osv|check-production-audit)|security/(osv|npm-audit))'
          output security_workflows '^\.github/workflows/'
          output smoke '^(app/(src|e2e|public)/|app/(package|playwright|vite\.config)|package(-lock)?\.json$|scripts/(db-bootstrap|seed-e2e)|supabase/|\.github/workflows/)'

  build:
    name: build
    needs: classify
    # SKIPPED, not started-and-guarded. GitHub rounds every JOB up to a whole
    # minute, so six jobs that each do nothing still bill six minutes — which is
    # what a docs-only change used to cost, twice (PR, then push). A skipped job
    # bills nothing.
    if: needs.classify.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No build-relevant changes
        if: needs.classify.outputs.build != 'true'
        run: echo "Build skipped because this change cannot affect the compiled application."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.classify.outputs.build == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.classify.outputs.build == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.build == 'true'
        run: npm ci

      - name: App — typecheck
        if: needs.classify.outputs.build == 'true'
        working-directory: app
        run: npx tsc -b

      - name: App — lint
        if: needs.classify.outputs.build == 'true'
        working-directory: app
        run: npm run lint

      - name: App — unit tests
        if: needs.classify.outputs.build == 'true'
        working-directory: app
        run: npm run test

      - name: App — production build
        if: needs.classify.outputs.build == 'true'
        working-directory: app
        run: npm run build

      - name: App — login bundle budget
        if: needs.classify.outputs.build == 'true'
        run: npm run check:bundle

      - name: Env example covers every client variable
        if: needs.classify.outputs.build == 'true'
        run: npm run check:env

      # ONE DOCUMENT. Unconditional on purpose: the failure mode is a deleted plan
      # REAPPEARING on disk, which no path filter can predict. Erica, 2026-08-28.
      - name: One planning document, and no other markdown
        run: npm run check:docs

      - name: Worker — typecheck
        if: needs.classify.outputs.build == 'true'
        working-directory: workers/photo-gateway
        run: npm run typecheck

      - name: Worker — unit tests
        if: needs.classify.outputs.build == 'true'
        working-directory: workers/photo-gateway
        run: npm run test

      - name: Worker — wrangler dry-run
        if: needs.classify.outputs.build == 'true'
        working-directory: workers/photo-gateway
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry

  database:
    name: database
    needs: classify
    # SKIPPED, not started-and-guarded. GitHub rounds every JOB up to a whole
    # minute, so six jobs that each do nothing still bill six minutes — which is
    # what a docs-only change used to cost, twice (PR, then push). A skipped job
    # bills nothing.
    if: needs.classify.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No database-relevant changes
        if: needs.classify.outputs.database != 'true'
        run: echo "Database validation skipped because no schema or database integration changed."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.classify.outputs.database == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.classify.outputs.database == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.database == 'true'
        run: npm ci

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        if: needs.classify.outputs.database == 'true'
        with:
          version: ${{ env.SUPABASE_VERSION }}

      - name: Check generated database types
        if: needs.classify.outputs.database == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALLOW_MISSING_TOKEN: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            if [ "$ALLOW_MISSING_TOKEN" = "true" ]; then
              echo "::notice::Untrusted fork has no SUPABASE_ACCESS_TOKEN; DB types drift explicitly skipped."
              exit 0
            fi
            echo "::error::SUPABASE_ACCESS_TOKEN is required for canonical DB types drift checks."
            exit 1
          fi
          npm run gen:types
          if ! git diff --exit-code -- app/src/lib/database.types.ts; then
            echo "::error::database.types.ts is stale. Run 'npm run gen:types' and commit the result."
            exit 1
          fi

      - name: Check deployed Edge Function configuration
        if: needs.classify.outputs.database == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REQUIRE_SUPABASE_ACCESS_TOKEN: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: node scripts/check-edge-config.mjs

      # Reads production's DATA, not its shape. A WARNING by design: it looks at a live
      # database a person is using, so it can go from clean to dirty with nobody
      # touching the code, and failing a PR for that would block unrelated work.
      - name: Check production data integrity
        if: needs.classify.outputs.database == 'true'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::No SUPABASE_ACCESS_TOKEN (fork); data integrity check skipped."
            exit 0
          fi
          node scripts/check-data-integrity.mjs

      - name: Start local Supabase with an empty migration directory
        if: needs.classify.outputs.database == 'true'
        run: |
          mkdir -p /tmp/aon-mig-hold
          mv supabase/migrations/*.sql /tmp/aon-mig-hold/
          supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          mv /tmp/aon-mig-hold/*.sql supabase/migrations/

      - name: Run SQL regression tests
        if: needs.classify.outputs.database == 'true'
        run: bash scripts/db-test.sh

      - name: Verify export and restore round trip
        if: needs.classify.outputs.database == 'true'
        run: bash scripts/export-restore-roundtrip.sh

      - name: Stop local Supabase
        if: always() && needs.classify.outputs.database == 'true'
        run: supabase stop --no-backup || true

  security:
    name: security
    needs: classify
    # Same reasoning as build/database/smoke above.
    if: >-
      ${{ needs.classify.outputs.security_code == 'true'
          || needs.classify.outputs.security_deps == 'true'
          || needs.classify.outputs.security_workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (current tree)
        run: |
          VER=8.18.4
          # --retry: this download has failed the build four times with curl (22) 503
          # and curl (56), none of them a finding. A red check that means nothing
          # teaches you to re-run without reading it.
          # To a FILE, not a pipe: a retry that fires mid-stream would hand tar the
          # tail of one attempt glued to the head of the next.
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 20 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-git --redact --exit-code 1 --verbose

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.classify.outputs.security_deps == 'true' || needs.classify.outputs.security_code == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies for dependency scans
        if: needs.classify.outputs.security_deps == 'true'
        run: npm ci

      - name: Audit production dependencies
        if: needs.classify.outputs.security_deps == 'true'
        run: npm run audit:production

      - name: OSV dependency scan
        if: needs.classify.outputs.security_deps == 'true'
        run: |
          VER=2.4.0
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 20 \
            "https://github.com/google/osv-scanner/releases/download/v${VER}/osv-scanner_linux_amd64" \
            -o osv-scanner
          chmod +x osv-scanner
          node scripts/check-osv.mjs ./osv-scanner

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: needs.classify.outputs.security_code == 'true' || needs.classify.outputs.security_workflows == 'true'
        with:
          python-version: "3.12"

      - name: Semgrep first-party source scan
        if: needs.classify.outputs.security_code == 'true'
        run: |
          pip install semgrep==1.172.0
          node scripts/check-semgrep.mjs semgrep app/src workers/photo-gateway

      - name: Install zizmor
        if: needs.classify.outputs.security_workflows == 'true'
        run: pip install zizmor==1.28.0

      - name: Audit GitHub Actions workflows
        if: needs.classify.outputs.security_workflows == 'true'
        run: zizmor .github/workflows

  smoke:
    name: smoke
    needs: classify
    # SKIPPED, not started-and-guarded. GitHub rounds every JOB up to a whole
    # minute, so six jobs that each do nothing still bill six minutes — which is
    # what a docs-only change used to cost, twice (PR, then push). A skipped job
    # bills nothing.
    if: needs.classify.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: No browser-relevant changes
        if: needs.classify.outputs.smoke != 'true'
        run: echo "Browser smoke test skipped because the user-facing application did not change."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.classify.outputs.smoke == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.classify.outputs.smoke == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.smoke == 'true'
        run: npm ci

      - name: Build public preview target
        if: needs.classify.outputs.smoke == 'true'
        working-directory: app
        run: npm run build

      - name: Install Chromium
        if: needs.classify.outputs.smoke == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: app

      - name: Run public Chromium smoke tests
        if: needs.classify.outputs.smoke == 'true'
        run: npx playwright test e2e/public.spec.ts --project=desktop-chrome
        working-directory: app

      - name: Upload Playwright report
        if: always() && needs.classify.outputs.smoke == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-report
          path: app/playwright-report/
          retention-days: 7

  full-browser:
    name: Full browser matrix
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: ${{ env.SUPABASE_VERSION }}

      - name: Start disposable local Supabase
        run: |
          hold="$(mktemp -d)"
          restore_migrations() {
            if compgen -G "$hold/*.sql" > /dev/null; then
              mv "$hold"/*.sql supabase/migrations/
            fi
          }
          trap restore_migrations EXIT
          mv supabase/migrations/*.sql "$hold"/
          supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          restore_migrations
          trap - EXIT

      - name: Bootstrap schema and export local test configuration
        run: |
          AON_BOOTSTRAP_CONFIRM=yes bash scripts/db-bootstrap.sh --yes
          supabase status -o json > /tmp/aon-supabase-status.json
          api_url="$(jq -r '.API_URL' /tmp/aon-supabase-status.json)"
          publishable_key="$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' /tmp/aon-supabase-status.json)"
          secret_key="$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' /tmp/aon-supabase-status.json)"
          echo "::add-mask::$publishable_key"
          echo "::add-mask::$secret_key"
          echo "VITE_SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "TEST_BOT_EMAIL=owner.e2e@example.invalid" >> "$GITHUB_ENV"
          echo "TEST_BOT_PASSWORD=Local-E2E-owner-2026!" >> "$GITHUB_ENV"
          echo "REQUIRE_AUTH_E2E=true" >> "$GITHUB_ENV"

      - name: Seed fictional local users
        run: npm run seed:e2e

      - name: Build local Supabase preview target
        working-directory: app
        run: npm run build

      - name: Install full browser matrix
        run: npx playwright install --with-deps chromium webkit
        working-directory: app

      - name: Run the complete browser suite
        working-directory: app
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-full-report
          path: app/playwright-report/
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  release-gate:
    name: Release gate
    if: always()
    needs: [build, database, security, smoke]
    runs-on: ubuntu-latest
    outputs:
      deploy_enabled: ${{ steps.release.outputs.deploy_enabled }}
    steps:
      - name: Require all PR gates
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          # SKIPPED IS NOT FAILURE. Since the gates became job-level skips (to stop
          # billing a minute per idle job), a change that touches no app code leaves
          # build/database/smoke as 'skipped'. That means "there was nothing to check",
          # which is the whole point — only a real failure may stop a release.
          for result in "$BUILD_RESULT" "$DATABASE_RESULT" "$SECURITY_RESULT" "$SMOKE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required release gate did not pass (got: $result)."; exit 1 ;;
            esac
          done

      - name: Determine whether production deployment is enabled
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          FLAG: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          flag_norm="$(printf '%s' "$FLAG" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          enabled=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/main" ] && [ "$flag_norm" = "true" ]; then
            enabled=true
          fi
          echo "deploy_enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "release gate: enabled=$enabled (event=$EVENT_NAME ref=$REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    if: >-
      ${{ !cancelled()
          && needs['release-gate'].result == 'success'
          && needs['release-gate'].outputs.deploy_enabled == 'true' }}
    needs: release-gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
      VITE_PHOTO_GATEWAY_URL: ${{ secrets.VITE_PHOTO_GATEWAY_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_STRAVA_CLIENT_ID: ${{ secrets.VITE_STRAVA_CLIENT_ID }}
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A frontend can compile against an RPC/column that production does not have.
      # That happened with migration 0177: CI deployed the new card while the live
      # database still exposed card_view v1. Refuse to upload any build until both
      # recovery and the production schema are proven for this exact repository state.
      - name: Require a fresh recoverable backup
        env:
          CLOUDFLARE_API_TOKEN_MASTER: ${{ secrets.CLOUDFLARE_API_TOKEN_MASTER }}
        run: npm run backup:check

      # THERE IS NO `supabase db push` STEP HERE, AND THAT IS DELIBERATE.
      #
      # It was added 2026-08-15 (#81) and never ran once, because it needs a database
      # password that was never set. Auditing it on 2026-08-16 showed what would have
      # happened the moment somebody added one, and it is worth writing down.
      #
      # THE LEDGER IS KEYED TWO WAYS. 152 rows use this repo's `0NNN` prefix and 75
      # use a 14-digit timestamp. `check:ledger` matches on the migration NAME, so it
      # sees 2 gaps. `supabase db push` matches on the VERSION key, so it sees 42 —
      # every migration from 0153 to 0194, all of them long since applied.
      #
      # `--include-all` would therefore have re-run 42 migrations against live data.
      # It would not have survived them: 0191 ends with an unguarded
      # `alter table public.visits drop column is_trip`, and that column is already
      # gone. But 0153..0190 run first, each in its own transaction, and several of
      # them backfill — 0190 recomputes place counts, 0188 rewrites visit_profiles and
      # activity_profiles. A backfill re-deriving something a person has since fixed
      # by hand is exactly the failure this repository keeps having.
      #
      # Erica, 2026-08-16: "I want to delete the risk rather than manage it."
      #
      # So the schema is applied BEFORE the deploy, by `scripts/apply-migration.mjs`,
      # which applies one named file and records it in the ledger in the SAME
      # transaction — either both happen or neither, so the ledger cannot drift again.
      # It authenticates with SUPABASE_ACCESS_TOKEN, so no database password needs to
      # exist at all. The check below is what enforces the order.

      # No bundle is uploaded until production actually has every migration in this repo.
      # A frontend can compile against an RPC the live database does not expose — that
      # happened with 0177, which deployed a card the database could not answer.
      - name: Require every repository migration in production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRICT: "1"
        run: npm run check:ledger

      # AND REQUIRE EVERY HEADER TO BE TRUE ABOUT ITSELF.
      #
      # `check:drafts` has existed since 2026-08-30, is wired to npm, and was in NO workflow.
      # It had never run in CI once. On 2026-08-31 it was run by hand for the first time and
      # immediately found `0292_josh_history_becomes_joshs_own.sql` still saying "DRAFT —
      # REHEARSED, NOT APPLIED" while production had applied it — the exact thing it exists
      # to catch, sitting there for a day.
      #
      # STRICT=1 IS NOT OPTIONAL. Without it the script exits 0 on EVERY failure path,
      # including a missing token, so it reports success having proved nothing. That is the
      # same skip-is-indistinguishable-from-pass defect as `backup-freshness` passing on NaN
      # and `verify-live` skipping silently, both of which this file already guards against.
      - name: Require every migration header to be true about itself
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRICT: "1"
        run: npm run check:drafts

      - name: Validate deployment target and secrets
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_MAPTILER_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for production deployment."
              exit 1
            fi
          done

      - name: Build exact gated SHA with provenance
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          node scripts/write-build-version.mjs
          npm run build --workspace app

      - name: Deploy gated build to Cloudflare Pages
        working-directory: app
        run: npx wrangler pages deploy dist --project-name adventureorno-com --branch main --commit-hash "${{ github.sha }}" --commit-dirty=false

      - name: Smoke production routes, headers, assets, and exact SHA
        env:
          SMOKE_BASE_URL: https://adventureorno.com
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/smoke-pages.mjs

  # ---------------------------------------------------------------------------
  # THE LIVE CHECK, IN CI AT LAST.
  #
  # `verify:live` is the file that decides whether a request Erica made is done —
  # 2026-08-11: "a request counts as done when its check is green HERE." It has existed
  # for weeks and NOTHING HAS EVER RUN IT. Not this workflow, not the nightly. It ran
  # only when somebody typed it locally.
  #
  # That is how SEVEN of its checks sat red against production without a single thing
  # going red, and it is why the count was discovered by hand on 2026-08-30 rather than
  # reported. A check nobody runs is a comment.
  #
  # AFTER THE DEPLOY, NOT BEFORE. It asks "is it on the site", so it has to run against
  # the site as it now is. Running it on a PR would test the previous deploy and call it
  # this PR's result.
  #
  # IT MUST FAIL RATHER THAN SKIP. The fixture skips when it cannot mint a session, and a
  # skip is indistinguishable from a pass in a green run — the same defect as
  # backup-freshness passing on NaN, and the same one that hid these seven. So the
  # prerequisites are asserted FIRST, as a step that exits 1 with the missing name.
  verify-live:
    name: Verify live
    if: >-
      ${{ !cancelled()
          && needs['deploy-production'].result == 'success' }}
    needs: deploy-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # THE ANTI-SKIP GUARD. liveTest mints a session through the admin API; without all
      # three of these `canMintSession` is false and every authed check quietly skips.
      # Name the missing one and stop, rather than reporting a green run of nothing.
      - name: Refuse to run blind
        run: |
          missing=""
          [ -n "$VITE_SUPABASE_URL" ]            || missing="$missing VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing VITE_SUPABASE_PUBLISHABLE_KEY"
          [ -n "$SUPABASE_SECRET_KEY" ]          || missing="$missing SUPABASE_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Cannot mint a session, so the authed live checks would SKIP and this job would pass having proved nothing. Missing:$missing"
            exit 1
          fi
          echo "All three present - the live checks will actually run."

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app

      # `npm run verify:live` at the repo root sources ./.env.local first, which exists on
      # a developer's machine and NEVER on a runner — the first CI run of this job died on
      # `sh: 1: .: cannot open ./.env.local`. The three values it would have supplied are
      # already in this job's `env:` above, from repository secrets, so call the workspace
      # script directly and let the environment do its job.
      - name: Verify what is actually on the site
        run: npm run verify:live --workspace app

      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-live-failures
          path: app/test-results/
          retention-days: 14
