name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: App — typecheck
        working-directory: app
        run: npx tsc -b
      - name: App — lint
        working-directory: app
        run: npm run lint
      - name: App — test
        working-directory: app
        run: npm run test

      - name: Worker — typecheck
        working-directory: workers/photo-gateway
        run: npm run typecheck
      - name: Worker — test
        working-directory: workers/photo-gateway
        run: npm run test

      # Build-only check of the worker (no deploy). Skips gracefully if it needs
      # secrets/account that CI doesn't have.
      - name: Worker — wrangler dry-run
        working-directory: workers/photo-gateway
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry || echo "wrangler dry-run skipped (needs account/secrets)"
